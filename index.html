<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#edf4f6">
<meta name="description" content="RiseKiro — подарки Telegram">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://nft.fragment.com" crossorigin>
<link rel="preconnect" href="https://portal-market.com" crossorigin>
<title>RiseKiro</title>
<style>
:root {
  color-scheme: light;
  --bg: #edf4f6;
  --surface: #ffffff;
  --surface-hover: #f3f8fa;
  --surface-muted: #f4f8fa;
  --surface-elevated: #eaf2f5;
  --ink: #20333d;
  --ink-secondary: #5c7380;
  --muted: #6d828d;
  --line: #dce7eb;
  --line-strong: #c8d9e0;
  --accent: #127e94;
  --accent-hover: #0b6578;
  --accent-soft: rgba(18,126,148,.09);
  --accent-border: rgba(18,126,148,.3);
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); scroll-behavior: smooth; }
body { margin: 0; min-width: 320px; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.45; }
button, input, select { font: inherit; }
button { cursor: pointer; color: inherit; }
button:disabled { opacity: .5; cursor: not-allowed; }
a { color: inherit; text-decoration: none; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Topbar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  display: flex;
  align-items: center;
  gap: 16px;
  max-width: 1480px;
  min-height: 56px;
  margin: 0 auto;
  padding: 8px 20px;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  flex: none;
}
.brand-logo {
  display: block;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid var(--line-strong);
  background: var(--surface-muted);
  object-fit: cover;
}
.brand-text {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.brand-text strong {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -.02em;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--surface-elevated);
  color: var(--ink);
  font-size: 13px;
  font-weight: 500;
  transition: background-color .15s, border-color .15s;
}
.button:hover:not(:disabled) {
  background: #e1edf2;
  border-color: #475569;
}
.button-primary {
  border-color: var(--accent);
  background: var(--accent);
  color: #ffffff;
  font-weight: 600;
}
.button-primary:hover:not(:disabled) {
  border-color: var(--accent-hover);
  background: var(--accent-hover);
}
.icon-svg {
  width: 15px;
  height: 15px;
  flex: none;
}

/* Main two-column workspace */
.workspace {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  gap: 18px;
  align-items: start;
  max-width: 1480px;
  margin: 0 auto;
  padding: 18px 20px 40px;
}

/* Sidebar Filters */
.sidebar {
  position: sticky;
  top: 72px;
  z-index: 25;
  display: grid;
  gap: 12px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.sidebar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.sidebar-head h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
}
.reset-button {
  padding: 3px 7px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--accent);
  font-size: 12px;
  font-weight: 500;
}
.reset-button:hover {
  background: var(--accent-soft);
}
.filter-field {
  min-width: 0;
}
.field-label {
  display: block;
  margin: 0 0 5px;
  color: var(--ink-secondary);
  font-size: 12px;
  font-weight: 600;
}
.control {
  width: 100%;
  min-width: 0;
  min-height: 38px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--surface-muted);
  color: var(--ink);
  font-size: 13px;
  transition: border-color .15s;
}
.control::placeholder { color: var(--muted); }
.control:focus {
  border-color: var(--accent);
  outline: none;
}
.price-inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

/* Custom Dropdown Pickers (Collection + Traits) */
.collection-picker, .trait-picker {
  position: relative;
}
.collection-picker { z-index: 20; }
.trait-picker { z-index: 10; }
.trait-picker.open { z-index: 30; }

.collection-trigger, .trait-trigger {
  display: grid;
  align-items: center;
  width: 100%;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--surface-muted);
  text-align: left;
  transition: border-color .15s, background-color .15s;
}
.collection-trigger {
  grid-template-columns: 36px minmax(0, 1fr) 16px;
  gap: 10px;
  min-height: 48px;
  padding: 6px 10px 6px 8px;
}
.trait-trigger {
  grid-template-columns: 28px minmax(0, 1fr) 16px;
  gap: 8px;
  min-height: 40px;
  padding: 5px 10px 5px 6px;
}
.collection-trigger:hover, .collection-trigger[aria-expanded="true"],
.trait-trigger:hover, .trait-trigger[aria-expanded="true"] {
  border-color: var(--accent);
  background: var(--surface-hover);
}
.collection-trigger-icon {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 6px;
  background: var(--surface-elevated);
  color: var(--ink-secondary);
  overflow: hidden;
}
.collection-trigger-icon img {
  width: 100%;
  height: 100%;
  padding: 2px;
  object-fit: contain;
}
.collection-trigger-copy {
  display: grid;
  min-width: 0;
  gap: 1px;
}
.collection-trigger-copy small {
  color: var(--ink-secondary);
  font-size: 11px;
}
.collection-trigger-copy strong {
  overflow: hidden;
  font-size: 13px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.trait-trigger-preview {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 5px;
  overflow: hidden;
  background: var(--surface-elevated);
  color: var(--ink-secondary);
}
.trait-trigger-label {
  overflow: hidden;
  font-size: 13px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.trigger-chevron {
  color: var(--ink-secondary);
  font-size: 12px;
  text-align: center;
}

.collection-popover, .trait-popover {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  max-height: 360px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: #e9f2f5;
  box-shadow: 0 14px 34px rgba(0, 0, 0, .55);
  overflow: hidden;
}
.collection-search, .trait-search {
  flex: 0 0 auto;
  padding: 8px;
  border-bottom: 1px solid var(--line);
  background: #f7fafb;
}
.collection-search input, .trait-search input {
  width: 100%;
  min-height: 34px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  background: var(--surface-muted);
  color: var(--ink);
  font-size: 13px;
}
.collection-search input::placeholder, .trait-search input::placeholder {
  color: var(--muted);
}
.collection-search input:focus, .trait-search input:focus {
  border-color: var(--accent);
  outline: none;
}
.collection-list, .trait-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1 1 auto;
  min-height: 0;
  max-height: 300px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 6px;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.collection-option, .trait-option {
  flex: 0 0 auto;
  display: grid;
  align-items: center;
  width: 100%;
  padding: 5px 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ink);
  text-align: left;
  transition: background-color .1s;
}
.collection-option {
  grid-template-columns: 32px minmax(0, 1fr) auto;
  gap: 9px;
  min-height: 42px;
}
.trait-option {
  grid-template-columns: 32px minmax(0, 1fr);
  gap: 9px;
  min-height: 40px;
}
.collection-option:hover, .trait-option:hover {
  background: var(--surface-hover);
}
.collection-option.active, .trait-option.active {
  background: var(--accent-soft);
  color: #127e94;
}
.collection-option img, .collection-fallback {
  width: 32px;
  height: 32px;
  border-radius: 5px;
  object-fit: contain;
  background: var(--surface-elevated);
}
.collection-fallback {
  display: grid;
  place-items: center;
  color: var(--ink-secondary);
}
.collection-option strong, .trait-option strong {
  overflow: hidden;
  font-size: 13px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.collection-floor {
  color: var(--ink-secondary);
  font-family: var(--mono);
  font-size: 11px;
  white-space: nowrap;
}

.trait-option-media {
  width: 32px;
  height: 32px;
  border-radius: 5px;
  overflow: hidden;
  flex: none;
}
.trait-thumb {
  width: 100%;
  height: 100%;
  padding: 2px;
  object-fit: contain;
  background: var(--surface-elevated);
}
.trait-swatch {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 5px;
  border: 1px solid rgba(255, 255, 255, .18);
}
.trait-symbol-wrap {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  padding: 4px;
  border-radius: 5px;
  background: var(--surface-elevated);
}
.trait-symbol-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: invert(1) brightness(1.1);
  opacity: .88;
}
.trait-fallback {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  background: var(--surface-elevated);
  color: var(--ink-secondary);
}

/* Catalog Content Area */
.catalog-main {
  position: relative;
  z-index: 1;
  min-width: 0;
}
.catalog-banner {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  margin-bottom: 12px;
}
.catalog-banner img {
  flex: none;
  width: 48px;
  height: 48px;
  padding: 3px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  object-fit: contain;
  background: var(--surface-muted);
}
.catalog-banner-copy {
  min-width: 0;
}
.catalog-banner h1 {
  overflow: hidden;
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -.01em;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.catalog-banner p {
  margin: 2px 0 0;
  color: var(--ink-secondary);
  font-size: 13px;
}
.catalog-banner-meta {
  margin-left: auto;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface-muted);
  color: var(--ink-secondary);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.results-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  padding: 0 2px;
}
.results-info {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.results-count {
  font-size: 14px;
  font-weight: 700;
}
.results-updated {
  color: var(--ink-secondary);
  font-size: 12px;
}
.currency-note {
  color: var(--ink-secondary);
  font-size: 12px;
}

.active-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border: 1px solid var(--accent-border);
  border-radius: 6px;
  background: var(--accent-soft);
  color: #127e94;
  font-size: 12px;
  font-weight: 500;
}
.filter-chip span {
  color: var(--ink-secondary);
}

/* Gift Inventory Grid */
.gift-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
  gap: 12px;
}
.gift-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  transition: border-color .15s, transform .15s;
}
.gift-card:hover {
  border-color: var(--line-strong);
}
.gift-media {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  padding: 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: var(--surface-muted);
}
.gift-poster {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .18s ease;
}
.gift-poster.is-fallback {
  object-fit: contain;
  padding: 14%;
}
.gift-card:hover .gift-poster:not(.is-fallback) {
  transform: none;
}
.gift-poster-fallback {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  color: var(--ink-secondary);
  font-size: 22px;
  font-weight: 700;
}
.serial-badge {
  position: absolute;
  z-index: 2;
  top: 8px;
  left: 8px;
  padding: 3px 7px;
  border-radius: 5px;
  background: rgba(15, 20, 28, .72);
  backdrop-filter: blur(4px);
  color: #f1f5f9;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  pointer-events: none;
}
.price-badge {
  position: absolute;
  z-index: 2;
  bottom: 8px;
  right: 8px;
  padding: 4px 9px;
  border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 6px;
  background: rgba(15, 20, 28, .86);
  backdrop-filter: blur(4px);
  color: #ffffff;
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.gift-body {
  display: flex;
  flex-direction: column;
  flex: 1;
  padding: 10px 11px 11px;
}
.gift-title-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
}
.gift-name {
  overflow: hidden;
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  text-overflow: ellipsis;
  white-space: nowrap;
}
.gift-traits {
  display: grid;
  gap: 4px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
  font-size: 12px;
}
.gift-trait-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  min-width: 0;
}
.gift-trait-row span {
  color: var(--ink-secondary);
  flex: none;
}
.gift-trait-val {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  overflow: hidden;
}
.gift-trait-val b {
  overflow: hidden;
  color: var(--ink);
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mini-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .25);
  flex: none;
}
.gift-actions {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px;
  margin-top: auto;
  padding-top: 10px;
}
.gift-open-btn {
  min-height: 32px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--surface-elevated);
  color: var(--ink);
  font-size: 12px;
  font-weight: 600;
  transition: background-color .15s, border-color .15s;
}
.gift-open-btn:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: #127e94;
}
.gift-copy-btn {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--surface-muted);
  color: var(--ink-secondary);
  transition: background-color .15s, border-color .15s, color .15s;
}
.gift-copy-btn:hover {
  border-color: var(--accent);
  background: var(--accent);
  color: #ffffff;
}

.gift-load-more {
  display: flex;
  justify-content: center;
  padding: 20px 0 8px;
}
.empty-state {
  display: flex;
  min-height: 180px;
  grid-column: 1 / -1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 24px;
  border: 1px dashed var(--line-strong);
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink-secondary);
  font-size: 13px;
  text-align: center;
}
.empty-state strong {
  color: var(--ink);
  font-size: 15px;
}
.loading-state {
  display: flex;
  min-height: 180px;
  grid-column: 1 / -1;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink-secondary);
  font-size: 13px;
}
.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid var(--line-strong);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.page-footer {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 10px;
  margin-top: 24px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  color: var(--ink-secondary);
  font-size: 12px;
}

.toast {
  position: fixed;
  z-index: 60;
  right: 18px;
  bottom: 18px;
  max-width: min(380px, calc(100vw - 36px));
  padding: 10px 14px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: #1e2938;
  color: var(--ink);
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .5);
}

/* Modal Dialog */
.gift-dialog {
  width: min(840px, calc(100vw - 28px));
  max-height: calc(100dvh - 28px);
  overflow: auto;
  margin: auto;
  padding: 0;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .65);
}
.gift-dialog[open] {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.gift-dialog::backdrop {
  background: rgba(7, 10, 15, .75);
  backdrop-filter: blur(3px);
}
.gift-dialog-media {
  position: relative;
  min-height: 390px;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  background: var(--surface-muted);
  border-right: 1px solid var(--line);
}
.gift-dialog-poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity .2s ease;
}
.gift-dialog-poster.hidden {
  opacity: 0;
  pointer-events: none;
}
.gift-dialog-animation {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  display: block;
  pointer-events: none;
}
.gift-dialog-animation svg {
  width: 100% !important;
  height: 100% !important;
  display: block;
}
.gift-dialog-info {
  display: flex;
  flex-direction: column;
  padding: 20px;
}
.gift-dialog-topline {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.gift-dialog-heading h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
}
.gift-dialog-heading p {
  margin: 3px 0 0;
  color: var(--ink-secondary);
  font-size: 13px;
}
.gift-dialog-close {
  display: grid;
  flex: none;
  place-items: center;
  width: 32px;
  height: 32px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--surface-elevated);
  color: var(--ink-secondary);
  font-size: 18px;
}
.gift-dialog-close:hover {
  background: var(--surface-hover);
  color: var(--ink);
}
.gift-dialog-price {
  margin-top: 14px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-muted);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.gift-dialog-price span {
  color: var(--ink-secondary);
  font-size: 12px;
}
.gift-dialog-price strong {
  color: var(--ink);
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.gift-dialog-section-title {
  margin: 16px 0 6px;
  color: var(--ink-secondary);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.gift-attributes {
  display: grid;
  border-top: 1px solid var(--line);
}
.gift-attribute {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.gift-attribute span {
  color: var(--ink-secondary);
}
.gift-attribute-val {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-align: right;
  font-weight: 600;
}
.gift-attribute-chip {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  overflow: hidden;
  flex: none;
}
.gift-dialog-actions {
  display: grid;
  gap: 8px;
  margin-top: 16px;
}
.gift-dialog-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 10px;
  color: #127e94;
  font-size: 13px;
  font-weight: 500;
}
.gift-dialog-link:hover {
  text-decoration: underline;
}
.dialog-note {
  margin: auto 0 0;
  padding: 10px 12px;
  border-radius: 6px;
  background: var(--surface-muted);
  color: var(--ink-secondary);
  font-size: 12px;
}

@media (max-width: 1024px) {
  .how-steps { display: none; }
  .workspace {
    grid-template-columns: 1fr;
    padding: 14px 16px 32px;
  }
  .sidebar {
    position: static;
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .sidebar-head, .collection-picker {
    grid-column: 1 / -1;
  }
}
@media (max-width: 680px) {
  .topbar-inner { padding: 8px 12px; }
  .brand-text span { display: none; }
  .sidebar { grid-template-columns: 1fr 1fr; }
  .gift-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  .catalog-banner { padding: 12px; }
  .catalog-banner-meta { display: none; }
  .gift-dialog[open] { grid-template-columns: 1fr; }
  .gift-dialog-media {
    min-height: 0;
    aspect-ratio: 1 / 1;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
}
@media (max-width: 420px) {
  .sidebar { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

  var img=safeMediaUrl(entry.image),fb=safeMediaUrl(entry.fallbackImage);

function updateFacetOptions(){
  var modelsMap=new Map(),backdropsMap=new Map(),symbolsMap=new Map();
  (collectionAttributes.models||[]).forEach(function(m){
    if(m&&m.name)modelsMap.set(m.name.toLocaleLowerCase("ru-RU"),{name:m.name,image:m.image||"",fallbackImage:""});
  });
  (collectionAttributes.backdrops&&collectionAttributes.backdrops.length?collectionAttributes.backdrops:STATIC_BACKDROPS).forEach(function(b){
    if(b&&b.name)backdropsMap.set(b.name.toLocaleLowerCase("ru-RU"),{name:b.name,center:b.center||"",edge:b.edge||""});
  });
  (collectionAttributes.symbols||[]).forEach(function(s){
    var sImg=s.image||(isLocal?("/api/symbol-icon?name="+encodeURIComponent(s.name)+"&collection="+encodeURIComponent(selectedCollection)):"");
    if(s&&s.name)symbolsMap.set(s.name.toLocaleLowerCase("ru-RU"),{name:s.name,image:sImg});
  });
  items.forEach(function(item){
    var m=String(item.model||"").trim();
    if(m){
      var mk=m.toLocaleLowerCase("ru-RU"),prevM=modelsMap.get(mk),poster=item.poster_url||item.photo||"";
      if(!prevM)modelsMap.set(mk,{name:m,image:item.model_image||poster,fallbackImage:poster});
      else{if(!prevM.image)prevM.image=item.model_image||poster;if(!prevM.fallbackImage&&poster)prevM.fallbackImage=poster;}
    }
    var b=String(item.backdrop||"").trim();
    if(b){
      var bk=b.toLocaleLowerCase("ru-RU"),prevB=backdropsMap.get(bk);
      if(!prevB)backdropsMap.set(bk,{name:b,center:item.backdrop_center||"",edge:item.backdrop_edge||""});
      else{if(!prevB.center&&item.backdrop_center)prevB.center=item.backdrop_center;if(!prevB.edge&&item.backdrop_edge)prevB.edge=item.backdrop_edge;}
    }
    var s=String(item.symbol||"").trim();
    if(s){
      var sk=s.toLocaleLowerCase("ru-RU"),prevS=symbolsMap.get(sk);
      var sImg=item.symbol_image||(isLocal?("/api/symbol-icon?name="+encodeURIComponent(s)+"&collection="+encodeURIComponent(item.collection||selectedCollection)):"");
      if(!prevS)symbolsMap.set(sk,{name:s,image:sImg});
      else if(!prevS.image)prevS.image=sImg;
    }
  });
  facetOptions.model=Array.from(modelsMap.values()).sort(function(a,b){return a.name.localeCompare(b.name,"ru");});
  facetOptions.backdrop=Array.from(backdropsMap.values()).sort(function(a,b){return a.name.localeCompare(b.name,"ru");});
  facetOptions.symbol=Array.from(symbolsMap.values()).sort(function(a,b){return a.name.localeCompare(b.name,"ru");});
  ["model","backdrop","symbol"].forEach(function(type){renderTraitButton(type);renderTraitList(type);});
  renderActiveChips();
}

async function fetchAttributes(collectionName){
  try{
    var data;
    if(isLocal){var r=await fetch("/api/attributes?collection="+encodeURIComponent(collectionName||""),{cache:"no-store"});if(!r.ok)return;data=await r.json();}
    else{data=await CatalogPublic.attributes(collectionName);}
    if((selectedCollection||"")!==(collectionName||""))return;
    collectionAttributes={
      models:Array.isArray(data.models)?data.models:[],
      backdrops:Array.isArray(data.backdrops)?data.backdrops:STATIC_BACKDROPS,
      symbols:Array.isArray(data.symbols)?data.symbols:[]
    };
    updateFacetOptions();
  }catch(_){}
}

function itemKey(item){
  var c=String(item.collection||"").normalize("NFKC").trim().toLocaleLowerCase("ru-RU"),n=String(item.number||"").trim();
  if(n)return"gift:"+c+":"+n;if(item.gift_url)return"url:"+String(item.gift_url).trim().toLocaleLowerCase("en-US");
  return"name:"+c+":"+String(item.name||"").normalize("NFKC").trim().toLocaleLowerCase("ru-RU");
}

function mergeLowest(list){
  var best=new Map();
  list.forEach(function(item){var key=itemKey(item),old=best.get(key),p=Number(item.price_rub),oldP=old?Number(old.price_rub):NaN;if(!old||(Number.isFinite(p)&&(!Number.isFinite(oldP)||p<oldP)))best.set(key,item);});
  return Array.from(best.values()).sort(function(a,b){return Number(a.price_rub||Infinity)-Number(b.price_rub||Infinity);});
}

  } else {
    copy.sort(function(a,b){return Number(a.price_rub||0)-Number(b.price_rub||0);});

  return copy;

  stopCardAnimation();
  $("giftGrid").innerHTML='<div class="loading-state"><span class="spinner" aria-hidden="true"></span>Загружаем предложения…</div>';
  $("giftMoreBtn").hidden=true;$("giftResultCount").textContent="Загружаем…";
}

function searchUrl(cursors){
  var p=new URLSearchParams();
  p.set("collection",selectedCollection);p.set("model",$("modelFilter").value);p.set("backdrop",$("backdropFilter").value);p.set("symbol",$("symbolFilter").value);
  if($("giftNumber").value.trim())p.set("number",$("giftNumber").value.trim());
  p.set("min_rub",$("minPrice").value.trim());p.set("max_rub",$("maxPrice").value.trim());
  p.set("page0",String(cursors[0]==null?0:cursors[0]));p.set("page1",String(cursors[1]==null?1:cursors[1]));p.set("page2",String(cursors[2]==null?"":cursors[2]));
  if(cursors[0]===null)p.set("skip0","1");if(cursors[1]===null)p.set("skip1","1");if(cursors[2]===null)p.set("skip2","1");
  return"/api/search?"+p.toString();
}

async function fetchListings(append){
  if(busy){pendingSearch=true;return;}busy=true;$("refreshBtn").disabled=true;$("giftMoreBtn").disabled=true;
  var cursors=append?pageCursors.slice():[0,1,""];
  if(!append){items=[];visibleLimit=PAGE_SIZE;setLoading();}
  try{
    if(isLocal){
      var response=await fetch(searchUrl(cursors),{cache:"no-store"});if(!response.ok)throw new Error("request failed");
      var data=await response.json();pageCursors=Array.isArray(data.next)?data.next:[null,null,null];
      if(data.resolved_collection&&!selectedCollection){
        selectedCollection=data.resolved_collection;
        renderCollectionButton();renderCollectionOptions();fetchAttributes(selectedCollection);
      }
      items=mergeLowest(append?items.concat(data.items||[]):(data.items||[]));
    }
    if(!isLocal){var data=await CatalogPublic.search({collection:selectedCollection,model:$("modelFilter").value,backdrop:$("backdropFilter").value,symbol:$("symbolFilter").value,number:$("giftNumber").value,min:$("minPrice").value,max:$("maxPrice").value,sort:$("sortBy").value,offset:cursors[0]||0},collections,BACKDROP_COLORS);pageCursors=data.next;items=mergeLowest(append?items.concat(data.items):data.items);}
    updateFacetOptions();renderItems();
  }catch(_){
    if(!append){$("giftGrid").innerHTML='<div class="empty-state"><strong>Каталог временно недоступен</strong><span>Нажмите «Обновить» или попробуйте через несколько секунд.</span></div>';$("giftResultCount").textContent="Ошибка загрузки";}
  }finally{busy=false;$("refreshBtn").disabled=false;$("giftMoreBtn").disabled=false;if(pendingSearch){pendingSearch=false;fetchListings(false);}}
}

async function loadCollections(){
  fetchAttributes(selectedCollection);
  try{
    if(isLocal){
      var response=await fetch("/api/collections",{cache:"no-store"});if(!response.ok)throw new Error("request failed");
      var data=await response.json();collections=Array.isArray(data.collections)?data.collections:[];
    }
    if(!isLocal)collections=await CatalogPublic.collections();
    renderCollectionButton();renderCollectionOptions();await fetchListings(false);
  }catch(_){
    $("collectionList").innerHTML='<div class="empty-state" style="min-height:100px;padding:12px"><strong>Не удалось загрузить коллекции</strong></div>';
    await fetchListings(false);
  }
}

function loadLottie(){
  if(window.lottie)return Promise.resolve(true);
  if(lottieLoader)return lottieLoader;
  lottieLoader=new Promise(function(resolve){
    var s=document.createElement("script");
    s.src="lottie.min.js";
    s.onload=function(){resolve(Boolean(window.lottie));};
    s.onerror=function(){lottieLoader=null;s.remove();resolve(false);};
    document.head.appendChild(s);
  });
  return lottieLoader;
}

function clearAnimation(){
  if(modalLottie){try{modalLottie.destroy();}catch(_){}modalLottie=null;}
  var stage=$("giftDialogAnimation");
  stage.replaceChildren();
  stage.dataset.url="";
  var poster=$("giftDialogPoster");
  if(poster)poster.classList.remove("hidden");
}

async function playAnimation(url){
  var stage=$("giftDialogAnimation");
  var poster=$("giftDialogPoster");
  clearAnimation();
  if(!url)return;
  stage.dataset.url=url;
  try{
    var loaded=await Promise.all([loadLottie(),animationData(url)]),ready=loaded[0];
    if(!ready||stage.dataset.url!==url||!$("giftDialog").open)return;
    var data=loaded[1];
    if(!data)return;
    if(stage.dataset.url!==url||!$("giftDialog").open)return;
    modalLottie=window.lottie.loadAnimation({
      container:stage,
      renderer:"svg",
      loop:true,
      autoplay:true,
      animationData:structuredClone(data),
      rendererSettings:{preserveAspectRatio:"xMidYMid meet"}
    });
    modalLottie.addEventListener("DOMLoaded",function(){
      if(stage.dataset.url===url&&$("giftDialog").open&&poster){
        poster.classList.add("hidden");
      }
    });
  }catch(_){}
}

function openGift(index){
  stopCardAnimation();
  var item=orderedItems()[index];if(!item)return;activeDialogItem=item;
  var name=giftDisplayCode(item);
  $("giftDialogName").textContent=name;$("giftDialogCollection").textContent=item.collection||"";$("giftDialogPrice").textContent=formatRub(item.price_rub);
  var media=$("giftDialogMedia");$("dialogSymbols").innerHTML=symbolsHtml(item);
  media.style.background=(item.backdrop_center&&item.backdrop_edge)?"radial-gradient(circle,"+item.backdrop_center+","+item.backdrop_edge+")":"#121822";
  var image=itemImage(item),poster=$("giftDialogPoster");
  poster.classList.remove("hidden");
  if(image){poster.src=image;poster.alt=name;}else{poster.removeAttribute("src");poster.alt="";}
  var link=safeHttpsUrl(item.gift_url);$("giftDialogLink").hidden=!link;if(link)$("giftDialogLink").href=link;
  var modelEntry=item.model?{name:item.model,image:item.model_image||image,fallbackImage:image}:null;
  var backdropEntry=item.backdrop?{name:item.backdrop,center:item.backdrop_center,edge:item.backdrop_edge}:null;
  var symbolEntry=item.symbol?{name:item.symbol,image:item.symbol_image||(isLocal?("/api/symbol-icon?name="+encodeURIComponent(item.symbol)+"&collection="+encodeURIComponent(item.collection||"")):"")}:null;
  $("giftAttributes").innerHTML=[
    ["Модель",item.model,"model",modelEntry],
    ["Фон",item.backdrop,"backdrop",backdropEntry],
    ["Узор",item.symbol,"symbol",symbolEntry]
  ].map(function(x){
    var chip=x[1]?'<span class="gift-attribute-chip">'+traitMediaHtml(x[2],x[3])+'</span>':"";
    return'<div class="gift-attribute"><span>'+x[0]+'</span><strong class="gift-attribute-val">'+chip+escapeHtml(x[1]||"—")+"</strong></div>";
  }).join("");
  $("giftDialog").showModal();
  playAnimation(safeMediaUrl(item.animation_url));
}

$("mobileFilters").addEventListener("click",function(){var expanded=document.querySelector('.sidebar').classList.toggle('mobile-expanded');this.setAttribute('aria-expanded',String(expanded));});

var hoverLottie=null,hoverMedia=null,hoverTimer=0,hoverGeneration=0,pendingAnimations=new Map();
var warmObserver=null,warmQueue=[],warmActive=0;
function pumpAnimationWarmup(){
  while(warmActive<2&&warmQueue.length){
    var url=warmQueue.shift();
    if(animationCache.has(url)||pendingAnimations.has(url))continue;
    warmActive++;
    Promise.all([loadLottie(),animationData(url)]).finally(function(){warmActive--;pumpAnimationWarmup();});
  }
}
function warmVisibleAnimations(){
  if(warmObserver)warmObserver.disconnect();
  warmQueue=[];
  var connection=navigator.connection;
  if(!window.IntersectionObserver||matchMedia("(prefers-reduced-motion:reduce)").matches||
      (connection&&(connection.saveData||/^(slow-)?2g$/.test(connection.effectiveType))))return;
  var ordered=orderedItems();
  warmObserver=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(!entry.isIntersecting)return;
      warmObserver.unobserve(entry.target);
      var item=ordered[Number(entry.target.dataset.giftIndex)],url=item&&safeMediaUrl(item.animation_url);
      if(url&&!animationCache.has(url)&&!pendingAnimations.has(url)&&!warmQueue.includes(url))warmQueue.push(url);
    });
    if(window.requestIdleCallback)requestIdleCallback(pumpAnimationWarmup,{timeout:400});else setTimeout(pumpAnimationWarmup,0);
  },{rootMargin:"80px"});
  $("giftGrid").querySelectorAll(".gift-media").forEach(function(media){warmObserver.observe(media);});
}
async function animationData(url){
  if(animationCache.has(url))return animationCache.get(url);
  if(pendingAnimations.has(url))return pendingAnimations.get(url);
  var task=(async function(){try{var r=await fetch(url,{cache:"force-cache"});if(!r.ok)return null;var data=await r.json();if(animationCache.size>=12)animationCache.delete(animationCache.keys().next().value);animationCache.set(url,data);return data;}catch(_){return null;}finally{pendingAnimations.delete(url);}})();
  pendingAnimations.set(url,task);return task;
}
function stopCardAnimation(){
  clearTimeout(hoverTimer);hoverGeneration++;
  if(hoverLottie){hoverLottie.destroy();hoverLottie=null;}
  if(hoverMedia){hoverMedia.classList.remove("is-animating");var stage=hoverMedia.querySelector(".gift-card-animation");if(stage)stage.replaceChildren();hoverMedia=null;}
}
function startCardAnimation(media,index){
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches||hoverMedia===media)return;
  stopCardAnimation();hoverMedia=media;var generation=hoverGeneration;
  hoverTimer=setTimeout(async function(){
    var item=orderedItems()[index];if(!item)return;var url=safeMediaUrl(item.animation_url);if(!url)return;
    var loaded=await Promise.all([loadLottie(),animationData(url)]);
    if(!loaded[0])return;
    var data=loaded[1];
    if(!data||generation!==hoverGeneration||!media.isConnected||!media.matches(":hover"))return;
    var stage=media.querySelector(".gift-card-animation");
    hoverLottie=window.lottie.loadAnimation({container:stage,renderer:"svg",loop:true,autoplay:true,animationData:structuredClone(data),rendererSettings:{preserveAspectRatio:"xMidYMid meet"}});
    hoverLottie.addEventListener("DOMLoaded",function(){if(generation===hoverGeneration)media.classList.add("is-animating");});
  },35);
}
$("giftGrid").addEventListener("pointerover",function(event){var media=event.target.closest(".gift-media");if(media)startCardAnimation(media,Number(media.dataset.giftIndex));});
$("giftGrid").addEventListener("pointerout",function(event){if(hoverMedia&&!hoverMedia.contains(event.relatedTarget))stopCardAnimation();});
window.addEventListener("blur",stopCardAnimation);
document.addEventListener("visibilitychange",function(){if(document.hidden)stopCardAnimation();});

$("copyFunpayBtn").addEventListener("click",function(){copyGiftMessage(activeDialogItem);});

document.addEventListener("error",function(event){
  var img=event.target;
  if(img&&img.tagName==="IMG"&&img.dataset.fallback&&img.src!==img.dataset.fallback){
    img.src=img.dataset.fallback;
    img.classList.add("is-fallback");
  }else if(img&&img.tagName==="IMG"&&img.closest(".collection-option,#activeCollectionIcon")){
    var fallback=document.createElement("span");fallback.className="collection-fallback";fallback.setAttribute("aria-hidden","true");fallback.innerHTML=SVG_ICONS.collection;img.replaceWith(fallback);
  }else if(img&&img.id==="giftCollectionImage"){
    img.hidden=true;
  }else if(img&&img.tagName==="IMG"&&img.closest('.trait-option-media')){
    var option=img.closest('[data-trait-type]'),type=option&&option.dataset.traitType;
    var placeholder=document.createElement('span');placeholder.className='trait-fallback';placeholder.setAttribute('aria-hidden','true');
    placeholder.innerHTML=(TRAIT_META[type]||TRAIT_META.model).icon;img.replaceWith(placeholder);
  }
},true);

$("collectionTrigger").addEventListener("click",function(){
  closeAllTraitPopovers();
  var pop=$("collectionPopover"),open=pop.hidden;pop.hidden=!open;$("collectionTrigger").setAttribute("aria-expanded",String(open));if(open){renderCollectionOptions();$("collectionList").scrollTop=0;$("collectionSearch").focus();}
});
$("collectionSearch").addEventListener("input",renderCollectionOptions);
$("collectionList").addEventListener("click",function(event){var option=event.target.closest("[data-collection]");if(option)setCollection(option.dataset.collection);});

["model","backdrop","symbol"].forEach(function(type){
  var meta=TRAIT_META[type];
  $(meta.triggerId).addEventListener("click",function(){
    $("collectionPopover").hidden=true;$("collectionTrigger").setAttribute("aria-expanded","false");
    var pop=$(meta.popoverId),open=pop.hidden;
    closeAllTraitPopovers(type);
    pop.hidden=!open;
    $(meta.triggerId).setAttribute("aria-expanded",String(open));
    $(meta.pickerId).classList.toggle("open",open);
    if(open){renderTraitList(type);$(meta.listId).scrollTop=0;$(meta.searchId).focus();}
  });
  $(meta.searchId).addEventListener("input",function(){traitLimits[type]=100;renderTraitList(type);});
  $(meta.listId).addEventListener("click",function(event){
    var more=event.target.closest('[data-trait-more]');
    if(more){var scroll=$(meta.listId).scrollTop;traitLimits[type]+=100;renderTraitList(type);$(meta.listId).scrollTop=scroll;return;}
    var btn=event.target.closest("[data-trait-type]");
    if(btn)setTraitValue(btn.dataset.traitType,btn.dataset.traitValue);
  });
});

$("activeChips").addEventListener("click",function(event){
  var traitBtn=event.target.closest("[data-clear-trait]");
  if(traitBtn){setTraitValue(traitBtn.dataset.clearTrait,"");return;}
  var inputBtn=event.target.closest("[data-clear-input]");
  if(inputBtn){$(inputBtn.dataset.clearInput).value="";renderActiveChips();syncUrlState();fetchListings(false);}
});

document.addEventListener("keydown",function(event){if(event.key==="Escape"){closeAllTraitPopovers();$("collectionPopover").hidden=true;$("collectionTrigger").setAttribute("aria-expanded","false");}});
document.addEventListener("click",function(event){
  if(!event.target.closest(".collection-picker")){$("collectionPopover").hidden=true;$("collectionTrigger").setAttribute("aria-expanded","false");}
  if(!event.target.closest(".trait-picker"))closeAllTraitPopovers();
});

$("sortBy").addEventListener("change",function(){if(!isLocal){fetchListings(false);}else{renderItems();}});
["giftNumber","minPrice","maxPrice"].forEach(function(id){$(id).addEventListener("change",function(){renderActiveChips();syncUrlState();fetchListings(false);});});
$("resetFilters").addEventListener("click",function(){
  ["modelFilter","backdropFilter","symbolFilter","giftNumber","minPrice","maxPrice","modelSearch","backdropSearch","symbolSearch"].forEach(function(id){$(id).value="";});
  $("sortBy").value="asc";
  closeAllTraitPopovers();
  ["model","backdrop","symbol"].forEach(function(type){renderTraitButton(type);renderTraitList(type);});
  renderActiveChips();
  syncUrlState();
  fetchListings(false);
});
$("refreshBtn").addEventListener("click",async function(){if(!isLocal)await window.CatalogPublic.refresh().catch(function(){});loadCollections();});
$("giftMoreBtn").addEventListener("click",function(){if(visibleLimit<items.length){visibleLimit+=PAGE_SIZE;renderItems();}else{fetchListings(true);}});
$("giftGrid").addEventListener("click",function(event){
  var copyBtn=event.target.closest("[data-copy-index]");
  if(copyBtn){copyGiftMessage(orderedItems()[Number(copyBtn.dataset.copyIndex)]);return;}
  var button=event.target.closest("[data-gift-index]");
  if(button)openGift(Number(button.dataset.giftIndex));
});
$("giftDialogClose").addEventListener("click",function(){$("giftDialog").close();});
$("giftDialog").addEventListener("click",function(event){if(event.target===$("giftDialog"))$("giftDialog").close();});
$("giftDialog").addEventListener("close",function(){clearAnimation();$("giftDialogPoster").removeAttribute("src");});

readUrlState();
renderCollectionButton();
updateFacetOptions();
loadCollections();
})();
</script>
</body>
